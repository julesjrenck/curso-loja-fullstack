name: curso-loja-fullstack

services:
  php:
    build: .
    environment:
      APP_NAME: "${APP_NAME}"
    command: ["php", "-S", "0.0.0.0:8000", "-t", "/app"]
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./src:/app:ro
      - vendor-php:/app/vendor
      - dados-demo:/dados

  backend:
    build: .
    init: true
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--tries=1", "--no-reload"]
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./backend:/app:ro
      - vendor-backend:/app/vendor
      - ./backend/storage:/app/storage:rw
      - ./backend/bootstrap/cache:/app/bootstrap/cache:rw

volumes:
  vendor-php:
  dados-demo:
  vendor-backend:
