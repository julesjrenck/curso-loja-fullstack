name: curso-loja-fullstack

services:
  php:
    build: .
    environment:
      APP_NAME: "${APP_NAME}"
    command: ["php", "-S", "0.0.0.0:8000", "-t", "/app"]
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./src:/app:ro
      - vendor-php:/app/vendor
      - dados-demo:/dados

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    init: true
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--tries=1", "--no-reload"]
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./backend:/app:ro
      - vendor-backend:/app/vendor
      - ./backend/storage:/app/storage:rw
      - ./backend/bootstrap/cache:/app/bootstrap/cache:rw

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Preencha MSSQL_SA_PASSWORD no .env local}"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 3g
    volumes:
      - dados-sqlserver:/var/opt/mssql

volumes:
  vendor-php:
  dados-demo:
  vendor-backend:
  dados-sqlserver:
