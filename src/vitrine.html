<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vitrine | Loja Fullstack</title>
    <link rel="stylesheet" href="vitrine.css">
</head>
<body>
    <header class="container cabecalho">
        <p>Loja Fullstack</p>
        <nav>
            <a href="#catalogo">Catálogo</a>
        </nav>
    </header>

    <main id="catalogo" class="container">
        <h1>Catálogo de produtos</h1>
        <p>Conheça os produtos da nossa loja.</p>

        <div class="produtos">
            <article class="produto">
                <h2>Camiseta</h2>
                <p>Preço: R$ 49,90</p>
            </article>

            <article class="produto">
                <h2>Caneca</h2>
                <p>Preço: R$ 29,90</p>
            </article>
        </div>
    </main>

    <footer class="container">
        <p>Loja Fullstack</p>
    </footer>
</body>
</html>
